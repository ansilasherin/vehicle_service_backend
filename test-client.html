<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Service API Tester</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-img-top { height: 180px; object-fit: cover; }
    .badge-price { font-size: 1rem; background-color: #0d6efd; color: white; padding: 5px 10px; border-radius: 5px; }
  </style>
</head>
<body class="p-4">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <h2>🚗 Vehicle Service Backend Tester</h2>
      <div class="d-flex align-items-center gap-2">
        <label class="fw-bold">Base URL:</label>
        <input type="text" id="baseUrl" class="form-control" style="width: 320px;" value="http://localhost:5000">
      </div>
    </div>

    <!-- TABS -->
    <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" onclick="loadCategories()">Vehicle Categories</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="loadProducts()">Accessories / Products</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="loadServices()">Services</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="showAuthTab()">Auth & Booking</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" onclick="showUploadTab()">Image Upload</button>
      </li>
    </ul>

    <!-- OUTPUT CONTAINER -->
    <div id="outputContainer" class="row g-4">
      <div class="col-12 text-center text-muted">
        <p>Loading default categories...</p>
      </div>
    </div>
  </div>

  <script>
    const getBaseUrl = () => document.getElementById('baseUrl').value.replace(/\/$/, "");
    let token = "";

    async function loadCategories() {
      const container = document.getElementById('outputContainer');
      container.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-primary"></div></div>';
      try {
        const res = await fetch(`${getBaseUrl()}/api/categories`);
        const data = await res.json();
        let html = '';
        data.forEach(cat => {
          html += `
            <div class="col-md-4">
              <div class="card h-100 shadow-sm border-0">
                <img src="${cat.images}" class="card-img-top" alt="${cat.catname}" onerror="this.src='https://via.placeholder.com/300x180?text=No+Image'">
                <div class="card-body">
                  <h5 class="card-title text-capitalize">${cat.catname}</h5>
                  <p class="text-muted small">Category ID: ${cat._id || cat.id}</p>
                </div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html || '<p class="text-center">No categories found</p>';
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger col-12">Error: ${err.message}. Make sure server is running!</div>`;
      }
    }

    async function loadProducts() {
      const container = document.getElementById('outputContainer');
      container.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-primary"></div></div>';
      try {
        const res = await fetch(`${getBaseUrl()}/api/products`);
        const json = await res.json();
        const products = json.data || json;
        let html = '';
        products.forEach(p => {
          html += `
            <div class="col-md-4">
              <div class="card h-100 shadow-sm border-0">
                <img src="${p.images}" class="card-img-top" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x180?text=No+Image'">
                <div class="card-body d-flex flex-column">
                  <div class="d-flex justify-content-between align-items-start mb-2">
                    <h5 class="card-title mb-0">${p.name}</h5>
                    <span class="badge-price">₹${p.price}</span>
                  </div>
                  <p class="text-muted small mb-2">${p.description || 'Quality vehicle accessory'}</p>
                  <span class="badge bg-secondary mb-2 align-self-start">${p.category || 'Accessory'}</span>
                </div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger col-12">Error: ${err.message}</div>`;
      }
    }

    async function loadServices() {
      const container = document.getElementById('outputContainer');
      container.innerHTML = '<div class="col-12 text-center"><div class="spinner-border text-primary"></div></div>';
      try {
        const res = await fetch(`${getBaseUrl()}/api/services`);
        const json = await res.json();
        const services = json.data || json;
        let html = '';
        services.forEach(s => {
          html += `
            <div class="col-md-4">
              <div class="card h-100 shadow-sm border-0 p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <h5 class="card-title text-primary mb-0">${s.name}</h5>
                  <span class="badge bg-success fs-6">₹${s.price}</span>
                </div>
                <p class="text-muted small">${s.description || 'Comprehensive vehicle care service'}</p>
                <div class="small text-secondary">Category: ${s.categoryId}</div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger col-12">Error: ${err.message}</div>`;
      }
    }

    function showAuthTab() {
      const container = document.getElementById('outputContainer');
      container.innerHTML = `
        <div class="col-md-6">
          <div class="card shadow-sm p-4 border-0">
            <h4>🔑 Login</h4>
            <div class="mb-3">
              <label>Phone / Username:</label>
              <input type="text" id="loginUser" class="form-control" value="admin">
            </div>
            <div class="mb-3">
              <label>Password:</label>
              <input type="password" id="loginPass" class="form-control" value="admin123">
            </div>
            <button class="btn btn-primary w-100" onclick="doLogin()">Login</button>
            <div id="loginResult" class="mt-3 small"></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card shadow-sm p-4 border-0">
            <h4>📅 Create Booking</h4>
            <div class="mb-3">
              <label>Service Name:</label>
              <input type="text" id="bookService" class="form-control" value="Bike Foam Washing">
            </div>
            <div class="mb-3">
              <label>Date:</label>
              <input type="date" id="bookDate" class="form-control" value="2026-11-20">
            </div>
            <div class="mb-3">
              <label>Time:</label>
              <input type="text" id="bookTime" class="form-control" value="10:00 AM">
            </div>
            <button class="btn btn-success w-100" onclick="doBooking()">Submit Booking</button>
            <div id="bookingResult" class="mt-3 small"></div>
          </div>
        </div>
      `;
    }

    async function doLogin() {
      const resDiv = document.getElementById('loginResult');
      resDiv.innerHTML = 'Logging in...';
      try {
        const res = await fetch(`${getBaseUrl()}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUser').value,
            password: document.getElementById('loginPass').value,
          })
        });
        const data = await res.json();
        if (data.token) {
          token = data.token;
          resDiv.innerHTML = `<span class="text-success fw-bold">✓ Logged in as ${data.data.username} (Role: ${data.data.role})</span><br><code class="text-muted" style="word-break:break-all;">Token: ${token.substring(0, 30)}...</code>`;
        } else {
          resDiv.innerHTML = `<span class="text-danger">Failed: ${data.message}</span>`;
        }
      } catch (err) {
        resDiv.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
      }
    }

    async function doBooking() {
      const resDiv = document.getElementById('bookingResult');
      if (!token) {
        resDiv.innerHTML = '<span class="text-danger">Please Login first to get JWT Token!</span>';
        return;
      }
      resDiv.innerHTML = 'Submitting booking...';
      try {
        const res = await fetch(`${getBaseUrl()}/api/bookings`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            service: document.getElementById('bookService').value,
            date: document.getElementById('bookDate').value,
            time: document.getElementById('bookTime').value
          })
        });
        const data = await res.json();
        if (data.success) {
          resDiv.innerHTML = `<span class="text-success fw-bold">✓ Booking Confirmed! ID: ${data.data._id}</span>`;
        } else {
          resDiv.innerHTML = `<span class="text-danger">Failed: ${data.message}</span>`;
        }
      } catch (err) {
        resDiv.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
      }
    }

    function showUploadTab() {
      const container = document.getElementById('outputContainer');
      container.innerHTML = `
        <div class="col-md-6 offset-md-3">
          <div class="card shadow-sm p-4 border-0">
            <h4>📸 Multer Image Upload Test</h4>
            <p class="text-muted small">Upload an image file from your device to the backend</p>
            <div class="mb-3">
              <input type="file" id="fileInput" class="form-control" accept="image/*">
            </div>
            <button class="btn btn-primary w-100" onclick="uploadImage()">Upload</button>
            <div id="uploadResult" class="mt-3"></div>
          </div>
        </div>
      `;
    }

    async function uploadImage() {
      const fileInput = document.getElementById('fileInput');
      const resDiv = document.getElementById('uploadResult');
      if (!fileInput.files[0]) {
        resDiv.innerHTML = '<span class="text-danger">Please choose a file first!</span>';
        return;
      }
      const formData = new FormData();
      formData.append('image', fileInput.files[0]);

      resDiv.innerHTML = 'Uploading...';
      try {
        const res = await fetch(`${getBaseUrl()}/api/upload`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          resDiv.innerHTML = `
            <div class="alert alert-success">
              <p class="mb-1 fw-bold">✓ Upload Success!</p>
              <p class="small text-break mb-2">${data.imageUrl}</p>
              <img src="${data.imageUrl}" class="img-thumbnail" style="max-height: 150px;">
            </div>
          `;
        } else {
          resDiv.innerHTML = `<span class="text-danger">Upload failed: ${data.message}</span>`;
        }
      } catch (err) {
        resDiv.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
      }
    }

    // Load initial
    loadCategories();
  </script>
</body>
</html>
